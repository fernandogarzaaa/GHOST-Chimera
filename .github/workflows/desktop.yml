name: Desktop installers

# Builds the Windows Setup exe and macOS DMG on every published Release
# (and on demand). Artifacts attach to the release; both are UNSIGNED —
# signing/notarization remain operator steps (see docs/DESKTOP_APP.md).

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build bundle
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/windows/build-windows.ps1
      - name: Install Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/windows/ghost-chimera.iss
          options: /DAppVersion=${{ github.ref_name }}
      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/installer/GhostChimeraSetup-*.exe

  macos-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build app and DMG
        run: bash packaging/macos/build-macos-app.sh
      - name: Attach DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/GhostChimera-*-macOS.dmg
