version: 2
updates:
  # uv understands pyproject.toml and keeps uv.lock in sync.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:20"
      timezone: UTC
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /streamlit-demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
